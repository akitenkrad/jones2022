[package]
name = "jones-simulation"
version = "0.1.0"
edition = "2021"

[lib]
name = "jones2022_simulation"
path = "src/lib.rs"

[[bin]]
name = "jones"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5", features = ["derive"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
anyhow      = "1.0"

# social-simulation framework (socsim) — jones2022 is a cognitive-bias probe
# pipeline (semantic-preserving transform → LLM query → sandbox eval → indicator),
# NOT an ABM tick loop, so — like the sibling LLM-eval replication gong2026 — it
# pulls in NO socsim-core/engine/grid/net. Every piece of plumbing is delegated to
# the consolidated socsim crates:
#   socsim-llm     — code generation (logprob-free `complete`; Ollama→OpenAI live
#                    fallback + prompt cache); `ScriptedClient` for the mock path.
#   socsim-metrics — `stats::mean` for functional accuracy / indicator rate.
#   socsim-reproduce — paper-anchor PASS/off harness (jones2022 PAPER_ANCHORS).
#   socsim-results — timestamped results dir + CSV/JSON writers.
# The only jones2022-specific logic is the transforms (E1 framing / E2 anchoring),
# the failure indicators φ, and the code-execution sandbox. Commit pinned via
# Cargo.lock.
socsim-llm       = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-llm", features = ["live"] }
socsim-metrics   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-metrics" }
socsim-reproduce = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-reproduce" }
socsim-results   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-results" }
