[project]
name = "jones-tools"
version = "0.1.0"
description = "Visualization & analysis tools for the jones2022 replication"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Test deps for the offline tool tests.
dev = [
    "pytest>=8.0",
]

[project.scripts]
jones-tools = "jones_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jones_tools"]
